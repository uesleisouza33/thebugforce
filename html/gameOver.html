<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/gameOver.css" />
  <title>Game Over</title>
</head>

<body>

  <div class="game-over-overlay">

    <div class="game-over-content">

      <img class="title-image" src="../assets/tituloGameOver.png" alt="Game Over">

      <p class="subtitulo">
        <span class="bug-icon"></span>
        Não foi dessa vez!
        <span class="bug-icon"></span>
      </p>

      <div class="score-box">
        <h2>Pontuação Final</h2>

        <div class="score-linha">
          <img src="../assets/favicon/favicon1.png" alt="">
          <span id="conter">000000</span>
          <img src="../assets/favicon/favicon1.png" alt="">
        </div>

        <div class="score-linha" style="margin-top:10px; opacity: 0.75;">
          <span style="font-size:0.65em; color:#ffdd88;">🏆 MELHOR: <span id="melhor-conter">000000</span></span>
        </div>

      </div>

      <div class="botoes">

        <button id="restart-btn" class="btn btn-blue">
          <span class="btn-icon">▶</span>
          Jogar Novamente
        </button>

        <button id="back-btn" class="btn btn-green">
          <span class="btn-icon">🏠</span>
          Menu Principal
        </button>

      </div>
    </div>

  </div>

  <footer>
    <span class="footer-ver">VER 1.0.0</span>
    <span class="footer-copy">&copy; THE BUGS STUDIOS 2026</span>
  </footer>

  <script src="../js/game/gameOver.js"></script>

</html>
