<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/vitoria.css" />
  <title>Vitória — The Bug Force</title>
</head>

<body>

  <div class="victory-overlay">

    <div class="victory-content">

      <p class="subtitulo">
        <span class="bug-icon"></span>
        Você derrotou os Bugs!
        <span class="bug-icon"></span>
      </p>

      <div class="score-box">
        <h2>Pontuação Final</h2>

        <div class="score-linha">
          <img src="../assets/favicon/favicon1.png" alt="">
          <span id="contador-vitoria">000000</span>
          <img src="../assets/favicon/favicon1.png" alt="">
        </div>

        <div class="score-linha" style="margin-top:10px; opacity: 0.75;">
          <span style="font-size:0.65em; color:#ffdd88;">🏆 MELHOR: <span id="melhor-vitoria">000000</span></span>
        </div>

      </div>

      <div class="botoes">

        <button id="jogar-novamente-btn" class="btn btn-blue">
          <span class="btn-icon">▶</span>
          Jogar Novamente
        </button>

        <button id="menu-btn" class="btn btn-green">
          <span class="btn-icon">🏠</span>
          Menu Principal
        </button>

      </div>
    </div>

  </div>

  <footer>
    <span class="footer-ver">VER 1.0.0</span>
    <span class="footer-copy">&copy; THE BUGS STUDIOS 2026</span>
  </footer>

  <script>
    const pontuacao     = parseInt(sessionStorage.getItem("pontuacaoFinal"),  10) || 0;
    const melhor        = parseInt(sessionStorage.getItem("melhorPontuacao"), 10) || 0;

    const elScore  = document.getElementById("contador-vitoria");
    const elMelhor = document.getElementById("melhor-vitoria");

    if (elScore)  elScore.textContent  = pontuacao;
    if (elMelhor) elMelhor.textContent = melhor;

    document.getElementById("jogar-novamente-btn").addEventListener("click", () => {
      window.location.href = "jogarSolo.html";
    });

    document.getElementById("menu-btn").addEventListener("click", () => {
      window.location.href = "../index.html";
    });
  </script>

</html>
