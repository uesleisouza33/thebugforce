<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="../assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="theme-color" content="#d10000">
  <link rel="stylesheet" href="../css/vitoria.css" />
  <title>Vitória</title>
</head>

<body>

  <!-- CUTSCENE OVERLAY -->
  <div id="cutscene-overlay" class="cutscene-overlay">
    <div class="cutscene-header">
      <span class="cutscene-title">🎬 CUTSCENE DE VITÓRIA</span>
      <button id="skip-cutscene-btn" class="btn-skip">PULAR ⏭</button>
    </div>

    <div class="video-container">
      <video id="victory-video" src="../assets/img/game/finalvideo.mp4" playsinline preload="auto"></video>
      <div id="play-prompt" class="play-prompt escondido">
        <button id="start-video-btn" class="btn-start-video">
          ▶ CLIQUE PARA INICIAR A CUTSCENE
        </button>
      </div>
    </div>
  </div>

  <div class="victory-overlay">

    <div class="victory-content">

      <img class="title-image" src="../assets/img/vitoria.png" alt="Vitória">

      <p class="subtitulo">
        <span class="bug-icon"></span>
        Você derrotou os Bugs!
        <span class="bug-icon"></span>
      </p>

      <div class="score-box">
        <h2>Pontuação Final</h2>

        <div class="score-linha">
          <img src="../assets/favicon/favicon1.png">
          <span id="contador-vitoria">0</span>
          <img src="../assets/favicon/favicon1.png">
        </div>


      </div>

      <div class="botoes">

        <button id="reassistir-btn" class="btn btn-yellow">
          <span class="btn-icon">🎬</span>
          Assistir Cutscene
        </button>

        <button id="jogar-novamente-btn" class="btn btn-blue">
          <span class="btn-icon">▶</span>
          Jogar Novamente
        </button>

        <button id="menu-btn" class="btn btn-green">
          <span class="btn-icon">🏠</span>
          Menu Principal
        </button>

      </div>
    </div>

  </div>

  <footer>
    <span class="footer-ver">VER 1.0.0</span>
    <span class="footer-copy">&copy; THE BUGS STUDIOS 2026</span>
  </footer>

  <script>
    const pontuacao = parseInt(sessionStorage.getItem("pontuacaoFinal"), 10) || 0;
    const melhor = parseInt(sessionStorage.getItem("melhorPontuacao"), 10) || 0;

    const elScore = document.getElementById("contador-vitoria");
    const elMelhor = document.getElementById("melhor-vitoria");

    if (elScore) elScore.textContent = pontuacao;
    if (elMelhor) elMelhor.textContent = melhor;

    const btnJogarNovamente = document.getElementById("jogar-novamente-btn");
    if (btnJogarNovamente) {
      btnJogarNovamente.addEventListener("click", () => {
        window.location.href = "jogarSolo.html";
      });
    }

    const btnMenu = document.getElementById("menu-btn");
    if (btnMenu) {
      btnMenu.addEventListener("click", () => {
        window.location.href = "../index.html";
      });
    }

    // --- CONTROLE DA CUTSCENE DE VITÓRIA ---
    const cutsceneOverlay = document.getElementById("cutscene-overlay");
    const victoryVideo = document.getElementById("victory-video");
    const skipBtn = document.getElementById("skip-cutscene-btn");
    const playPrompt = document.getElementById("play-prompt");
    const startVideoBtn = document.getElementById("start-video-btn");
    const reassistirBtn = document.getElementById("reassistir-btn");

    function encerrarCutscene() {
      if (victoryVideo) {
        victoryVideo.pause();
        victoryVideo.currentTime = 0;
      }
      if (cutsceneOverlay) {
        cutsceneOverlay.classList.add("escondido");
      }
    }

    function tocarCutscene() {
      if (!cutsceneOverlay || !victoryVideo) return;
      cutsceneOverlay.classList.remove("escondido");
      playPrompt.classList.add("escondido");
      victoryVideo.currentTime = 0;

      const playPromise = victoryVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("Autoplay bloqueado pelo navegador. Exibindo prompt do usuário:", error);
          playPrompt.classList.remove("escondido");
        });
      }
    }

    if (victoryVideo) {
      victoryVideo.addEventListener("ended", encerrarCutscene);
    }

    if (skipBtn) {
      skipBtn.addEventListener("click", encerrarCutscene);
    }

    if (startVideoBtn) {
      startVideoBtn.addEventListener("click", () => {
        playPrompt.classList.add("escondido");
        victoryVideo.play();
      });
    }

    if (reassistirBtn) {
      reassistirBtn.addEventListener("click", tocarCutscene);
    }

    // Tenta iniciar a cutscene automaticamente ao carregar a página
    window.addEventListener("DOMContentLoaded", () => {
      tocarCutscene();
    });
  </script>

</body>

</html>
