<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/escolhaSelecao.css">
    <title>Document</title>
</head>
<body>
    <img src="../assets/img/slots/painel.png" alt="Imagem no centro" id="imagem-central">
    <img src="../assets/img/slots/iconbugForce.png" alt="" id="icon" >
    <img src="../assets/img/slots/tituloEscolha.png" alt="titulo" id="titulo"> 
   
      <div> <!--  slots dos personagens estão nessa div -->
     <img src="../assets/img/slots/uesleiSlot.png" alt="Ueslei" id="ueslei" class="personagem-slot"
        data-nome="Ueslei"
        data-preview="../assets/img/manuel/ueslei.png"
        data-imagem="../assets/img/manuel/ueslei.png">

    <img src="../assets/img/slots/jairSlot.png" alt="Jair" id="jair" class="personagem-slot"
        data-nome="Jair"
        data-preview="../assets/img/manuel/jair.png"
        data-imagem="../assets/img/manuel/jair.png">

    <img src="../assets/img/slots/LarissaSlot.png" alt="Larissa" id="larissa" class="personagem-slot"
        data-nome="Larissa"
        data-preview="../assets/img/manuel/larissa.png"
        data-imagem="../assets/img/manuel/larissa.png">

    <img src="../assets/img/slots/bloqueadoSlot.png" alt="Bloqueado" id="blok" class="bloqueado">
    <img src="../assets/img/slots/bloqueadoSlot.png" alt="Bloqueado" id="blok2" class="bloqueado">
    <img src="../assets/img/slots/bloqueadoSlot.png" alt="Bloqueado" id="blok3" class="bloqueado">
    <img src="../assets/img/slots/plataBlue.png" alt="" id="blue" srcset="">
    <img src="../assets/img/slots/plataRed.png" alt="" id="red" srcset="">

     <img src="../assets/img/slots/ElielSlot.png" alt="Eliel" id="eliel" class="personagem-slot"
        data-nome="Eliel"
        data-preview="../assets/img/manuel/eliel.png"
        data-imagem="../assets/img/manuel/eliel.png">
    </div>

    <!-- Imagem que aparece ao lado do slot quando o mouse passa por cima (preview) -->
    <img id="preview-personagem" src="" alt="">

    <!-- Imagens que deslizam pra tela quando um personagem é escolhido -->
    <img id="img-p1" class="imagem-jogador" src="" alt="Personagem Jogador 1">
    <img id="img-p2" class="imagem-jogador" src="" alt="Personagem Jogador 2">

    <!-- Status da seleção (jogador da vez / confirmação) -->
    <div id="status-selecao">Jogador 1, escolha seu personagem</div>

    <button id="btn-confirmar">CONFIRMAR</button>

    <script src="../js/game/seelectPer.js" defer></script>
    <!-- 
  Cole este trecho no telaSelecao.html, logo ANTES da tag <script>.
  As classes/IDs já batem com o CSS (.botao-modo, #btn-multiplayer, #btn-singleplayer).
-->

<a href="multiplayer.html" id="btn-multiplayer" class="botao-modo">
    <svg class="icone-modo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="3"></circle>
        <circle cx="17" cy="9" r="2.5"></circle>
        <path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>
        <path d="M14.5 14.2c2.6 0.4 4.5 2.6 4.5 5.3"></path>
    </svg>
    <span class="texto-modo">
        <span class="titulo-modo">MULTIPLAYER</span>
        <span class="subtitulo-modo">Jogue com seu amigo!</span>
    </span>
</a>

<a href="singleplayer.html" id="btn-singleplayer" class="botao-modo">
    <svg class="icone-modo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3l7 7"></path>
        <path d="M3 10l7-7"></path>
        <path d="M14 14l7 7"></path>
        <path d="M21 14l-7 7"></path>
        <circle cx="3" cy="3" r="1.4"></circle>
        <circle cx="3" cy="10" r="1.4"></circle>
        <circle cx="21" cy="14" r="1.4"></circle>
        <circle cx="14" cy="21" r="1.4"></circle>
    </svg>
    <span class="texto-modo">
        <span class="titulo-modo">SINGLEPLAYER</span>
        <span class="subtitulo-modo">Jogue solo e supere desafios!</span>
    </span>
</a>
</body>
</html>
